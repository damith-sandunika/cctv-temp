# Application Info
spring.application.name=lumina-backend
server.port=8080

# MongoDB Configuration
# Supports local MongoDB by default or cloud MongoDB Atlas via MONGODB_URI environment variable
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lumina_db}
spring.data.mongodb.auto-index-creation=true

# Security & JWT Configuration
lumina.app.jwtSecret=luminaSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong1234567890!
lumina.app.jwtExpirationMs=86400000

# CORS Configuration
lumina.app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.lumina=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO

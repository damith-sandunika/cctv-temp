# Application Info
spring.application.name=lumina-backend
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lumina_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Security & JWT Configuration
lumina.app.jwtSecret=luminaSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong1234567890!
lumina.app.jwtExpirationMs=86400000

# CORS Configuration
lumina.app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.lumina=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
